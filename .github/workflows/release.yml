name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本号（如 2.4.9、2.5.0-rc1），前缀 v 可省略。留空则按 bump 递增，bump 为 none 时沿用 Makefile 的 PKG_VERSION。'
        required: false
        default: ''
      bump:
        description: '版本号递增方式，仅当 version 留空时生效'
        type: choice
        required: false
        default: 'none'
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build version
        id: resolve_version
        # Priority for the version that ends up in the package:
        #   1. workflow_dispatch input `version` (explicit, wins over bump)
        #   2. workflow_dispatch input `bump` (patch/minor/major on the baseline)
        #   3. PKG_VERSION from luci-app-mt5700m/Makefile (baseline)
        # Tag pushes ignore both inputs and keep the original assertion that
        # the pushed tag equals v${PKG_VERSION}.
        #
        # Inputs are passed through the environment instead of being expanded
        # into the script body so a crafted input cannot inject shell code.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail

          base="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"
          if [ -z "${base}" ]; then
            echo "ERROR: 无法从 luci-app-mt5700m/Makefile 读取 PKG_VERSION" >&2
            exit 1
          fi

          new="${base}"
          source_desc="Makefile PKG_VERSION（基线）"

          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            if [ -n "${INPUT_VERSION}" ]; then
              # Accept both "2.4.9" and "v2.4.9".
              new="${INPUT_VERSION#v}"
              source_desc="workflow_dispatch 输入 version=${INPUT_VERSION}"
            elif [ -n "${INPUT_BUMP}" ] && [ "${INPUT_BUMP}" != 'none' ]; then
              new="$(awk -v v="${base}" -v part="${INPUT_BUMP}" 'BEGIN{
                if (split(v, a, ".") < 3) { print "ERR"; exit 1 }
                if (part == "major") { a[1]++; a[2] = 0; a[3] = 0 }
                else if (part == "minor") { a[2]++; a[3] = 0 }
                else { a[3]++ }
                printf "%d.%d.%d\n", a[1], a[2], a[3]
              }')"
              if [ "${new}" = 'ERR' ]; then
                echo "ERROR: 无法从 ${base} 递增 ${INPUT_BUMP}（基线不是 X.Y.Z）" >&2
                exit 1
              fi
              source_desc="workflow_dispatch 输入 bump=${INPUT_BUMP}"
            fi
          fi

          # X.Y.Z, optionally followed by a pre-release suffix (-rc1, -beta.2).
          # Validated before anything is interpolated into sed/awk/tag names.
          if ! printf '%s' "${new}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "ERROR: 版本号格式非法：'${new}'（应为 X.Y.Z 或 X.Y.Z-后缀）" >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" != 'workflow_dispatch' ] && [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
            if [ "${GITHUB_REF_NAME}" != "v${new}" ]; then
              echo "ERROR: 标签 ${GITHUB_REF_NAME} 与 PKG_VERSION ${new} 不一致" >&2
              exit 1
            fi
          fi

          # scripts/build-release.sh copies luci-app-mt5700m/ into the SDK, so
          # patching the checked-out Makefile is enough to make the apk carry
          # the requested version. The repository itself is never modified.
          if [ "${new}" != "${base}" ]; then
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${new}/" luci-app-mt5700m/Makefile
          fi

          echo "version=${new}" >> "${GITHUB_OUTPUT}"
          echo "base_version=${base}" >> "${GITHUB_OUTPUT}"
          echo "构建版本：${new}（来源：${source_desc}）"

          {
            echo '### 构建版本'
            echo
            echo "- 解析结果：\`${new}\`"
            echo "- 来源：${source_desc}"
            if [ "${new}" != "${base}" ]; then
              echo "- 基线（Makefile 原值）：\`${base}\`，已在工作区覆盖，**不写回仓库**"
            fi
            if ! grep -q "^## \[${new}\]" CHANGELOG.md 2>/dev/null; then
              echo "- 警告：CHANGELOG.md 中没有 \`[${new}]\` 条目，Release 说明会标注缺失"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            jq \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            curl \
            zstd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/openwrt-sdk
          key: sdk-${{ runner.os }}

      - name: Build with official OpenWrt SDK
        run: ./scripts/build-release.sh

      - name: Show build output
        run: |
          echo "===== GitHub Context ====="
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "REF=${GITHUB_REF}"
          echo "REF_NAME=${GITHUB_REF_NAME}"
          echo
          echo "===== dist-release ====="
          ls -lah dist-release || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mt5700m-${{ github.ref_name || 'manual' }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Build release notes
        run: |
          VERSION="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"

          # Release notes hold ONLY the CHANGELOG section of the version being
          # released.  They used to inline a copy of the whole project history,
          # so every release page showed thousands of characters of stale logs.
          # Stop at the next "## [" heading, not at EOF (a sed range would run
          # to the end of the file and drag in every older version).
          awk -v version="${VERSION}" '
            index($0, "## [" version "]") == 1 { inside = 1; print; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md | cat -s > section.md
          sed -i '1{/^$/d}' section.md

          {
            printf '## MT5700M Manager v%s\n\n' "${VERSION}"
            if [ -s section.md ]; then
              tail -n +2 section.md | sed '1{/^$/d}'
            else
              printf '_CHANGELOG.md 中没有 v%s 的条目。_\n' "${VERSION}"
            fi
            printf '\n---\n\n### 发布产物\n\n'
            printf '| 文件 | 大小 | SHA256 (前 12 位) |\n| --- | --- | --- |\n'
            for f in dist-release/*; do
              [ -f "$f" ] || continue
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" \
                "$(sha256sum "$f" | cut -c1-12)"
            done
            printf '\n### 安装\n\n```sh\n'
            printf 'apk add --allow-untrusted luci-app-mt5700m-*.apk ubus-at-daemon-*.apk sms-tool_q-*.apk\n'
            printf 'sha256sum -c SHA256SUMS\n'
            printf '```\n\n'
            printf '完整历史见仓库 [CHANGELOG.md](../../blob/main/CHANGELOG.md)。\n'
          } > release-notes.md

          echo '----- release notes preview -----'
          cat release-notes.md
          echo '--------------------------------'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_VERSION: ${{ steps.resolve_version.outputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Manual builds never claim a formal vX.Y.Z tag: the version is
            # baked into the name so a snapshot is identifiable at a glance
            # (e.g. manual-v2.4.9-20260910-013000).
            TAG="manual-v${RESOLVED_VERSION}-$(date +%Y%m%d-%H%M%S)"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "Release tag: ${TAG}"
          VERSION="$(sed -n 's/^PKG_VERSION:=//p' luci-app-mt5700m/Makefile)"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release..."
            gh release upload "${TAG}" dist-release/* --clobber
            gh release edit "${TAG}" \
              --title "MT5700M Manager v${VERSION}" \
              --notes-file release-notes.md
          else
            echo "Creating new release..."
            gh release create "${TAG}" \
              dist-release/* \
              --title "MT5700M Manager v${VERSION}" \
              --notes-file release-notes.md
          fi
